<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><meta name="theme-color" content="#0d1017"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>180 Days</title><style>:root{--bg:#0d1017;--line:#2a3344;--text:#f5f7fb;--red:#ff3048}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}.shell{height:100dvh;display:grid;grid-template-rows:auto 1fr}.nav-wrap{padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:rgba(8,12,19,.97);border-bottom:1px solid var(--line);z-index:20}.brand{font-size:20px;font-weight:950;margin:0 0 9px 3px}.brand span{color:var(--red)}.tabs{display:flex;gap:8px;overflow-x:auto}.tab{border:1px solid var(--line);background:#151b27;color:#c7d0df;border-radius:13px;padding:10px 14px;font-weight:900;font-size:14px;white-space:nowrap}.tab.active{background:linear-gradient(135deg,#ff3048,#c91434);border-color:#ff3048;color:#fff}.view{width:100%;height:100%;border:0;background:var(--bg);display:block}</style></head><body><div class="shell"><header class="nav-wrap"><div class="brand">180 <span>DÍAS</span></div><nav class="tabs"><button class="tab active" data-page="calendar.html">📅 Calendario</button><button class="tab" data-page="nutrition.html">🍽️ Nutrición</button><button class="tab" data-page="runloop.html">🏃 RunLoop</button></nav></header><iframe id="appView" class="view" src="calendar.html" allow="geolocation *"></iframe></div><script>const frame=document.getElementById('appView'),tabs=[...document.querySelectorAll('.tab')];function openPage(p){frame.src=p;tabs.forEach(t=>t.classList.toggle('active',t.dataset.page===p));location.hash=p.replace('.html','')}tabs.forEach(t=>t.onclick=()=>openPage(t.dataset.page));const h=location.hash.slice(1);if(h==='nutrition')openPage('nutrition.html');else if(h==='runloop')openPage('runloop.html');</script></body></html>
